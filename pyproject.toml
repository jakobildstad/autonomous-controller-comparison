[project]
name = "simple-robot-comparison"
version = "0.1.0"
description = "Manual MuJoCo driving with a reference path and varying grip"
readme = "README.md"
authors = [
    { name = "Jakob Ildstad", email = "jakobildstad@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "glfw>=2.10.2",
    "mujoco>=3.14.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
sim = "simple_robot_comparison.main:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
